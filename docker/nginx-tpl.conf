user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /tmp/nginx/nginx.pid;

# Load dynamic modules. See /usr/share/nginx/README.dynamic.
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

server {
    listen 8080;
    # Rendered by docker/entrypoint.sh to "listen [::]:8080;" on hosts with an
    # IPv6-capable kernel, empty otherwise. nginx defaults [::] listeners to
    # ipv6only=on, so the IPv4 line above is still needed alongside it.
    ${IPV6_LISTEN}
    server_tokens off;

    gzip on;
    # Bodies are content-negotiated; shared caches must key on Accept-Encoding.
    gzip_vary on;
    gzip_comp_level 9;
    gzip_types
        application/javascript
        application/rss+xml
        application/json
        application/x-javascript
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/js
        text/xml
        text/plain
    ;

    # One location block per apps/* micro-app, generated by entrypoint.sh at
    # container start — see docs/micro-apps.md. Always exists (built empty
    # into the image), so this include is never missing.
    include /etc/nginx/conf.d/micro-apps.conf;

    location /${ASSET_PATH} {
        root /usr/share/nginx/html;
        index index.html;

        try_files $uri $uri/ /${ASSET_PATH}index.html;

        location = /${ASSET_PATH}index.html {
            expires -1;
        }

        # Unhashed like index.html and versioned with it: never served stale.
        location = /${ASSET_PATH}boot-redirect.js {
            expires -1;
        }

        # Vite writes content-hashed files under assets/: a URL never changes
        # meaning, so browsers may keep them for a year without revalidating.
        # The .gz siblings next to them are produced at image build time
        # (Dockerfile), sparing nginx from compressing 1 MB chunks per request.
        location ^~ /${ASSET_PATH}assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            gzip_static on;
        }
    }
  }
}
