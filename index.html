<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <base href="%BASE_URL%" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge, chrome=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="author" content="opennodecloud.com" />
    <title>Waldur | Cloud Service Management</title>
    <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon" />
    <meta name="api-url" content="%VITE_API_URL%" />
    <!-- Deferred like the application module but listed first, so it runs
         ahead of it: sends anonymous visitors of / and /login/ straight to
         the default identity provider (see public/boot-redirect.js). -->
    <script src="boot-redirect.js" defer></script>
    <link
      rel="preload"
      href="%VITE_API_URL%api/configuration/"
      as="fetch"
      crossorigin
    />
    <!-- Render-blocking on purpose: brands the splash below before the first
         paint, so it never shows the Waldur defaults first (see
         public/boot-splash.js). -->
    <script src="boot-splash.js"></script>
    <style>
      /* Boot splash: painted immediately, branded by boot-splash.js, and
         removed once the first page is ready. src/LoadingScreen.tsx reuses
         these styles for the boot error screen. Literal
         colours because no stylesheet has loaded yet; they mirror the gray
         ramp in packages/design-tokens/tokens/colors.json. */
      :root {
        --boot-brand: #307300;
        --boot-bg: #f9fafb;
        --boot-fg: #101828;
        --boot-muted: #667085;
        --boot-track: #e4e7ec;
        --boot-surface: #ffffff;
        --boot-border: #e4e7ec;
        --boot-danger: #b42318;
        --boot-warn-bg: #fffaeb;
        --boot-warn-fg: #93370d;
        --boot-warn-border: #fedf89;
      }
      :root[data-theme='dark'] {
        --boot-bg: #0c111d;
        --boot-fg: #f5f5f6;
        --boot-muted: #94969c;
        --boot-track: #1f242f;
        --boot-surface: #161b26;
        --boot-border: #333741;
        --boot-danger: #f97066;
        --boot-warn-bg: #2a1d0a;
        --boot-warn-fg: #fec84b;
        --boot-warn-border: #4e3510;
      }
      .boot-splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        min-height: 100vh;
        margin: 0;
        padding: 24px 16px;
        box-sizing: border-box;
        text-align: center;
        background: var(--boot-bg);
        color: var(--boot-fg);
        font-family:
          Inter,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      /* A fixed layer over the application, so React can mount and route
         underneath it without the splash ever being replaced. */
      .boot-splash--static {
        position: fixed;
        inset: 0;
        z-index: 1100;
        /* No web font: the application's arrives mid-splash and would shift
           the text. */
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        transition: opacity 200ms ease-out;
      }
      .boot-splash--static[data-leaving] {
        opacity: 0;
        pointer-events: none;
      }
      .boot-splash__mark {
        display: grid;
        place-items: center;
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: var(--boot-brand);
      }
      .boot-splash__mark svg {
        width: 30px;
        height: 30px;
        fill: #fff;
      }
      .boot-splash__logo {
        display: block;
        /* Fixed height so nothing shifts while the image decodes. */
        height: 56px;
        width: auto;
        max-width: 96px;
        object-fit: contain;
      }
      /* The static splash is branded before it is parsed, through what
         boot-splash.js sets on <html>: the logo replaces the mark, and the
         name replaces the default one wherever it appears. */
      [data-boot-logo] .boot-splash--static .boot-splash__mark {
        width: 96px;
        border-radius: 0;
        background: var(--boot-logo) center / contain no-repeat;
      }
      [data-boot-logo] .boot-splash--static .boot-splash__mark svg {
        display: none;
      }
      [data-boot-name] .boot-splash--static .boot-splash__brand > span {
        display: none;
      }
      [data-boot-name] .boot-splash--static .boot-splash__brand::after {
        content: var(--boot-name);
      }
      .boot-splash__name {
        margin: 0;
        font-size: 17px;
        font-weight: 600;
        line-height: 1.3;
        letter-spacing: -0.01em;
      }
      .boot-splash__bar {
        position: relative;
        width: 180px;
        height: 3px;
        overflow: hidden;
        border-radius: 3px;
        background: var(--boot-track);
      }
      .boot-splash__bar::after {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        width: 40%;
        border-radius: 3px;
        background: var(--boot-brand);
        animation: boot-splash-slide 1.3s cubic-bezier(0.45, 0, 0.35, 1)
          infinite;
        animation-delay: var(--boot-bar-delay, 0s);
      }
      @keyframes boot-splash-slide {
        from {
          left: -40%;
        }
        to {
          left: 100%;
        }
      }
      .boot-splash__status {
        min-height: 20px;
        margin: 0;
        font-size: 13px;
        line-height: 20px;
        color: var(--boot-muted);
        /* Fast loads never show it. */
        animation: boot-splash-reveal 0.2s ease-out both;
        animation-delay: var(--boot-status-delay, 0.4s);
      }
      @keyframes boot-splash-reveal {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .boot-splash__slow {
        display: flex;
        align-items: center;
        gap: 12px;
        max-width: 360px;
        padding: 10px 12px;
        border: 1px solid var(--boot-warn-border);
        border-radius: 8px;
        background: var(--boot-warn-bg);
        color: var(--boot-warn-fg);
        font-size: 13px;
        line-height: 1.45;
        text-align: left;
      }
      .boot-splash__slow[hidden] {
        display: none;
      }
      .boot-splash__slow button {
        flex: none;
        padding: 6px 12px;
        border: 1px solid var(--boot-border);
        border-radius: 7px;
        background: var(--boot-surface);
        color: var(--boot-fg);
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        line-height: 1.2;
        cursor: pointer;
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash__bar::after {
          left: 30%;
          animation: none;
        }
        .boot-splash--static {
          transition: none;
        }
      }
    </style>
    <noscript>
      <style>
        .boot-splash {
          display: none;
        }
      </style>
    </noscript>
  </head>
  <body class="fixed-sidebar">
    <noscript>

        <div class="row">
          <div class="col-xs-12 col-sm-8 offset-sm-2 col-lg-6 offset-lg-3">

                <ul>

                      target="_blank"
                      rel="noopener noreferrer"
                      >Chrome</a
                    >
                  </li>
                  <li>
                    <a
                      href="https://activatejavascript.org/instructions/firefox#instructions"
                      target="_blank"
                      rel="noopener noreferrer"
                      >Firefox</a
                    >
                  </li>
                  <li>
                    <a
                      href="https://activatejavascript.org/instructions/opera#instructions"
                      target="_blank"
                      rel="noopener noreferrer"
                      >Opera</a
                    >
                  </li>
                  <li>
                    <a
                      href="https://activatejavascript.org/instructions/safari#instructions"
                      target="_blank"
                      rel="noopener noreferrer"
                      >Safari</a
                    >
                  </li>
                  <li>
                    <a
                      href="https://activatejavascript.org/instructions/ie#instructions"
                      target="_blank"
                      rel="noopener noreferrer"
                      >IE & Edge</a
                    >
                  </li>
                  <li>
                    <a
                      href="https://activatejavascript.org/instructions/ios#instructions"
                      target="_blank"
                      rel="noopener noreferrer"
                      >iOS</a
                    >
                  </li>
                  <li>
                    <a
                      href="https://activatejavascript.org/instructions/android#instructions"
                      target="_blank"
                      rel="noopener noreferrer"
                      >Android</a
                    >
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      </div>
    </noscript>
    <div id="wrapper" class="d-flex flex-column flex-root">
      <div id="react-root" class="d-flex flex-column flex-root"></div>
    </div>
    <!-- Outside React on purpose: the one splash from first paint until the
         first page is ready, removed by src/BootSplashGate.tsx. -->
    <div
      id="boot-splash"
      class="boot-splash boot-splash--static"
      role="status"
      aria-label="Starting Waldur"
    >
      <div class="boot-splash__mark" aria-hidden="true">
        <svg viewBox="-0.5 9.5 11 11">
          <path
            d="m2 10.04v7.98h1.98v2H0v-9.98zm7.96 0v9.98H5.98v-2h1.98v-7.98zm-3.98 3.98v4h-2v-4z"
          />
        </svg>
      </div>
      <p class="boot-splash__name">
        <span class="boot-splash__brand"><span>Waldur</span></span>
      </p>
      <div class="boot-splash__bar"></div>
      <p class="boot-splash__status">
        Starting <span class="boot-splash__brand"><span>Waldur</span></span
        >…
      </p>
      <div class="boot-splash__slow" hidden>
        <span>Taking longer than usual. The server may be busy.</span>
        <button type="button">Reload</button>
      </div>
    </div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
