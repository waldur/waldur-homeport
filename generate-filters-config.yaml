overrides:
  access_subnets:
    filters:
      - applies_to_portal
      - is_staff_managed
      - offering_uuid
    applies_to_portal:
      label: Applies to sign-in
    is_staff_managed:
      label: Managed by staff
    offering_uuid:
      label: Applies to offering
      operationId: marketplace_provider_offerings_list

  marketplace_service_provider_project_groups:
    filters:
      - in_use
      - offering_uuid
    in_use:
      label: Usage
      enumOverrides:
        'true': In use
        'false': Not in use
    offering_uuid:
      label: Offering
      name: offering
      operationId: marketplace_provider_offerings_list
      extraQuery:
        customer_uuid: 'props.customerUuid'

  marketplace_posix_identities:
    filters:
      - consumer_type
      - is_released
      - recyclable
    consumer_type:
      label: Principal kind
      placeholder: 'Any principal'
      enumOverrides:
        'user': User
        'robotaccount': Robot account
        'offeringusergroup': Project group
        'offeringrolegroup': Role group
    is_released:
      label: Status
      enumOverrides:
        'undefined': Any status
        'true': Released
        'false': Active
    recyclable:
      label: Recyclable
      enumOverrides:
        'undefined': All
        'true': Returned to the pool
        'false': Withheld from the pool

  customers:
    filters:
      - accounting_is_running
      - is_service_provider
      - is_call_managing_organization
      - organization_group_uuid
    is_service_provider:
      label: Service provider
    is_call_managing_organization:
      label: Call managing organization
      feature: show_call_management_functionality
    accounting_is_running:
      label: Accounting is running
      placeholder: 'Show with running accounting'
      enumOverrides:
        'undefined': All
        'true': Running accounting
        'false': Not running accounting

  financial_reports:
    filters:
      - customer_uuid
      - accounting_period
      - accounting_is_running
    customer_uuid:
      label: Service provider
      operationId: marketplace_service_providers_list
      valueField: customer_uuid
      labelField: customer_name
    accounting_period:
      label: Accounting period
      options: props.accountingPeriods
      mapTo: true
    accounting_is_running:
      label: Accounting is running
      placeholder: 'Show with running accounting'
      enumOverrides:
        true: Running accounting
        false: Not running accounting
        undefined: All

  marketplace_resources:
    filters:
      - customer_uuid
      - project_uuid
    customer_uuid:
      label: Organization
      name: customer_uuid
    project_uuid:
      name: project_uuid
      extraQuery:
        customer: 'props.organizationUuid'

  admin_arrow_consumption_records:
    filters:
      - customer_uuid
      - is_finalized
    customer_uuid:
      label: Organization
      name: customer_uuid
    is_finalized:
      label: Status
      enumOverrides:
        true: Finalized
        false: Pending

  sram_groups:
    filters:
      - customer_uuid
      - kind
    customer_uuid:
      label: Organization
      name: customer_uuid
    kind:
      label: Kind
      enumOverrides:
        co: Collaboration
        group: Group

  openstack_images:
    filters:
      - show_duplicate_names
    show_duplicate_names:
      label: Show duplicate names
      component: AwesomeCheckboxField
      badgeLabels:
        true: Yes
        false: No

  invoices_items:
    operationId: invoices_items_retrieve
    filters:
      - provider_uuid
      - project_uuid
      - offering_uuid
      - conceal_compensation_items
    provider_uuid:
      label: Service provider
      name: provider
      operationId: marketplace_service_providers_list
    project_uuid:
      name: project_uuid
      operationId: projects_list
      extraQuery:
        customer: 'props.customerUuid'
    offering_uuid:
      name: offering
      operationId: marketplace_public_offerings_list
      extraQuery:
        state: ['Active']
    conceal_compensation_items:
      component: AwesomeCheckboxField

  email_logs:
    filters:
      - emails
      - subject
      - sent_at
    emails:
      placeholder: 'Emails contains'
    subject:
      placeholder: 'Subject contains'
    sent_at:
      placeholder: 'YYYY-MM-DD'

  user_invitations:
    filters:
      - state
      - role_uuid
      - customer_uuid
      - scope_type
    state:
      label: State
      enumOverrides:
        requested: Requested
        rejected: Rejected
        pending: Pending
        project: Pending project start
        canceled: Canceled
        expired: Expired
        accepted: Accepted
    customer_uuid:
      label: Organization
    role_uuid:
      labelField: description
    scope_type:
      label: Scope type
      enumOverrides:
        customer: Organization
        project: Project
        offering: Offering
        call: Call
        proposal: Proposal
        service_provider: Service provider organization
        call_organizer: Call managing organization

  projects_list_users:
    filters:
      - project_role
    project_role:
      label: Role
      mapTo: role
      options: props.projectRoles
      valueField: name
      labelField: description

  customers_users:
    filters:
      - project_role
      - organization_role
    project_role:
      isMulti: true
      options: props.projectRoles
      valueField: name
      labelField: description
    organization_role:
      isMulti: true
      options: props.organizationRoles
      valueField: name
      labelField: description

  marketplace_project_update_requests:
    filters:
      - state
      - customer_uuid
    initialValues:
      state:
        - value: pending
          label: Pending
    state:
      isMulti: true
    customer_uuid:
      label: Organization
      name: customer_uuid
      operationId: customers_list

  roles:
    filters:
      - content_type
      - is_system_role
      - include_concealed
    content_type:
      label: Scope
      options: props.scopeOptions
      valueField: value
      labelField: label
    is_system_role:
      label: Type
      enumOverrides:
        'true': System role
        'false': Organization role
    include_concealed:
      label: Show concealed roles

  admin_roles:
    componentName: AdminRolesFilter
    operationId: roles_list
    filters:
      - content_type
      - is_system_role
      - is_active
    content_type:
      label: Scope
      enumOverrides:
        customer: Organization
        project: Project
        offering: Offering
        call: Call
        proposal: Proposal
        service_provider: Service provider organization
        call_organizer: Call managing organization
    is_system_role:
      label: Type
      enumOverrides:
        'true': System
        'false': Custom
    is_active:
      label: Status
      enumOverrides:
        'true': Active
        'false': Inactive

  changelog_entries:
    componentName: ChangelogEntriesFilter
    operationId: changelog_entries_retrieve
    filters:
      - relevant_only
      - type
      - risk
      - category
    relevant_only:
      label: Relevance
      placeholder: All entries
      enumOverrides:
        'true': Applies to this deployment
    type:
      label: Type
    risk:
      label: Risk
    category:
      label: Category
      # Lists every value: enumOverrides replaces the options rather than
      # relabelling some of them.
      enumOverrides:
        marketplace: Marketplace
        auth: Authentication
        identity: Identity
        openstack: OpenStack
        slurm: SLURM
        invoices: Invoices
        ai_assistant: AI assistant
        reporting: Reporting
        policy: Policy
        proposal: Proposals
        support: Support
        ui: UI
        infrastructure: Infrastructure
        notifications: Notifications

  admin_support_users:
    componentName: AdminSupportUsersFilter
    operationId: support_users_list
    filters:
      - backend_name
      - is_active
    backend_name:
      label: Helpdesk
    is_active:
      label: Status
      enumOverrides:
        'true': Active
        'false': Inactive

  notification_messages:
    filters:
      - is_overridden
    is_overridden:
      label: Status
      enumOverrides:
        'false': Not overridden
        'true': Overridden

  broadcast_messages:
    filters:
      - state

  admin_announcements:
    filters:
      - type
      - is_active
    is_active:
      label: Status
      enumOverrides:
        'true': Active
        'false': Inactive

  feedback_requests:
    filters:
      - survey_uuid
      - state
      - customer_uuid
      - answered_after
      - answered_before
    survey_uuid:
      label: Survey
      operationId: feedback_surveys_list
    customer_uuid:
      label: Organization
    answered_after:
      rangeLabel: Answered

  support_feedbacks:
    filters:
      - evaluation
      - user_uuid
      - period
    evaluation:
      label: Evaluation
      options: props.evaluationOptions
    period:
      label: Period
      options: props.periodOptions
      mapTo: true

  data_access_logs:
    filters:
      - start_date
      - end_date
      - accessor_type
      - user_uuid
    user_uuid:
      searchParam: full_name
      extraQuery:
        o: ['full_name']

  customer_quotas:
    initialValues:
      quota_name: { label: Resources, value: estimated_price }
    filters:
      - quota_name
    quota_name:
      label: Quota

  openportal_managed_projects:
    filters:
      - state

  openportal_remote_projects:
    filters:
      - state

  openportal_managed_project_audit:
    filters:
      - event_type
      - timestamp_after
      - timestamp_before
    event_type:
      label: Event type
      enumOverrides:
        created: Created
        approved: Approved
        rejected: Rejected
        deleted: Deleted
        note_added: Note added
        details_updated: Details updated
        project_attached: Project attached
        project_detached: Project detached
    timestamp_after:
      label: From
    timestamp_before:
      label: To

  openportal_remote_project_audit:
    filters:
      - event_type
      - timestamp_after
      - timestamp_before
    event_type:
      label: Event type
      enumOverrides:
        award_attempted: Award attempted
        award_rejected: Award rejected
        award_created: Award created
        award_updated: Award updated
        award_update_confirmed: Award update confirmed
        award_update_rejected: Award update rejected
        state_changed: State changed
        resource_deleted: Resource deleted
    timestamp_after:
      label: From
    timestamp_before:
      label: To

  marketplace_plan_components:
    filters:
      - offering_uuid
    offering_uuid:
      searchParam: name

  marketplace_plans_usage_stats:
    filters:
      - customer_provider_uuid
      - offering_uuid
    customer_provider_uuid:
      label: Service provider
      name: provider
      operationId: marketplace_service_providers_list
      labelField: customer_name
      valueField: customer_uuid
    offering_uuid:
      searchParam: name

  admin_arrow_billing_syncs:
    filters:
      - state
      - report_period_from
      - report_period_to
    state:
      label: State
      options:
        - label: Pending
          value: 1
        - label: Syncing
          value: 2
        - label: Synced
          value: 3
        - label: Failed
          value: 4
    report_period_from:
      label: Period from
      options: 'props.billingPeriods'
    report_period_to:
      label: Period to
      options: 'props.billingPeriods'

  admin_arrow_customer_mappings:
    filters:
      - waldur_customer_uuid
      - arrow_reference
      - is_active
    waldur_customer_uuid:
      label: Waldur Organization
      name: waldur_customer_uuid
    arrow_reference:
      label: Arrow Reference
    is_active:
      label: Active

  marketplace_customer_estimated_cost_policies:
    filters:
      - customer_uuid
    customer_uuid:
      label: Organization
      name: customer_uuid

  chat_threads:
    filters:
      # Collapsed into single range pickers by the _after/_before rule.
      - created_after
      - created_before
      - modified_after
      - modified_before
      - user
      - is_flagged
      - max_severity
      - is_archived
      - has_feedback
      - input_tokens_min
      - input_tokens_max
      - output_tokens_min
      - output_tokens_max
      - total_tokens_min
      - total_tokens_max
    user:
      searchParam: full_name

  anonymous_chat_interactions_conversations:
    filters:
      - created_after
      - created_before
      # Named after the aggregate it bounds, labelled after the column it
      # matches — the anonymous row is last active, never modified.
      - last_active_after
      - last_active_before
      - user_slug
      - is_flagged
      - severity
      - has_feedback
      - is_reviewed
      - input_tokens_min
      - input_tokens_max
      - output_tokens_min
      - output_tokens_max
      - total_tokens_min
      - total_tokens_max
    user_slug:
      label: Visitor
      placeholder: 'Visitor hash contains'
    last_active_after:
      # Matches the column, which mirrors the authenticated table's "Modified".
      rangeLabel: Modified

  events:
    filters:
      - customer_uuid
      - project_uuid
      - user_uuid
      - feature
    customer_uuid:
      label: Organization
      name: customer_uuid
    project_uuid:
      name: project_uuid
    user_uuid:
      label: User
      name: user
      searchParam: full_name
      extraQuery:
        o: ['full_name']
    feature:
      label: Type
      isMulti: true
      enumOverrides:
        projects: Project events
        resources: Resource events
        openstack_resources: OpenStack resource events

  system_logs:
    filters:
      - source
      - level
      - instance
      - logger_name
      - start_date
      - end_date
    start_date:
      component: DateField
      mapTo: false
    end_date:
      component: DateField
      mapTo: false

  marketplace_robot_accounts:
    filters:
      - customer_uuid
      - project_uuid
    customer_uuid:
      label: Organization
      name: customer
      operationId: marketplace_service_providers_robot_account_customers_list
      searchParam: customer_name
      extraPath:
        uuid: props.provider.uuid
    project_uuid:
      name: project_uuid
      operationId: marketplace_service_providers_robot_account_projects_list
      searchParam: project_name
      extraPath:
        uuid: props.provider.uuid

  reviewer_suggestions:
    filters:
      - status
    status:
      enumOverrides:
        pending: Pending
        confirmed: Confirmed
        rejected: Rejected
        invited: Invited

  conflicts_of_interest:
    filters:
      - round_uuid
      - status
      - severity
      - coi_type
      - detection_method
    round_uuid:
      label: Round
      name: round
      operationId: proposal_protected_calls_rounds_list
      searchParam: false
      extraPath:
        uuid: props.call.uuid
    status:
      label: Status
      isMulti: true
    severity:
      label: Severity
    coi_type:
      label: Type
      isMulti: true
      enumOverrides:
        INST_SAME: Institutional (Same)
        FIN_DIRECT: Financial (Direct)
        REL_FAMILY: Relative (Family)
        ROLE_NAMED: Role (Named)
        COLLAB_ACTIVE: Collaborative (Active)
        REL_MENTOR: Relationship (Mentor)
        REL_SUPERVISOR: Relationship (Supervisor)
        COAUTH_RECENT: Co-authorship (Recent)
        INST_DEPT: Institutional (Department)
        INST_FORMER: Institutional (Former)
        ROLE_CONF: Role (Confidential)
        COLLAB_GRANT: Collaborative (Grant)
        REL_EDITORIAL: Relationship (Editorial)
        COMPET: Competition
        COAUTH_OLD: Co-authorship (Old)
        INST_CONSORT: Institutional (Consortium)
        CONF_ATTEND: Conference Attendance
        SOC_MEMBER: Society Member
    detection_method:
      label: Detection

  customer_events:
    operationId: events_list
    initialValues:
      feature:
        - label: Organization events
          value: customers
    filters:
      - feature
    feature:
      label: Type
      isMulti: true
      enumOverrides:
        customers: Organization events
        projects: Project events
        resources: Resource events
        openstack_resources: OpenStack resource events

  user_group_invitations:
    filters:
      - is_active
    is_active:
      label: Group invitations
      component: AwesomeCheckboxField
      badgeLabels:
        true: Only active
        false: All

  invoices:
    filters:
      - state
    state:
      isMulti: true
      enumOverrides:
        pending: Pending
        pending_finalization: Pending finalization
        canceled: Canceled
        created: Created
        paid: Paid

  marketplace_provider_offerings:
    initialValues:
      state:
        - label: Draft
          value: Draft
        - label: Active
          value: Active
    filters:
      - state
    state:
      isMulti: true
      enumOverrides:
        Draft: Draft
        Active: Active
        Paused: Paused
        Archived: Archived
        Unavailable: Unavailable

  project_resources:
    operationId: marketplace_resources_list
    filters:
      - offering_uuid
    offering_uuid:
      operationId: marketplace_public_offerings_list
      extraQuery:
        project_uuid: 'props.project.uuid'

  # Resources of a single offering, shown on the provider offering details page.
  # The offering itself is fixed by the page, so it is not a filter here; state
  # and runtime state stay manual because they carry extra behaviour (the
  # include-terminated default and the dynamic option list respectively).
  provider_offering_resources:
    operationId: marketplace_provider_resources_list
    filters:
      - customer_uuid
      - project_uuid
      - plan_uuid
      - paused
      - downscaled
      - restrict_member_access
      - created
      - created_before
    # The filter names must match the `filter` ids declared on the resource
    # columns (see getResourceAllListColumns), otherwise the per-cell "Add
    # filter" button cannot find the filter and is not rendered at all.
    customer_uuid:
      label: Client organization
      name: organization
      facet: customer
    project_uuid:
      name: project
      facet: project
      extraQuery:
        customer: 'props.organizationUuid'
    plan_uuid:
      label: Plan
      name: plan
      facet: plan
      searchParam: false
      extraQuery:
        offering_uuid: 'props.offeringUuid'
    created:
      label: Created after
      component: DateField
    created_before:
      label: Created before
      component: DateField

  # Resources of one organization in the Organization summary report. The
  # organization is fixed by the page; "Include terminated" stays manual as it
  # rewrites the state filter.
  organization_summary_resources:
    operationId: marketplace_resources_list
    filters:
      - created
      - created_before
    created:
      label: Created after
      component: DateField
    created_before:
      label: Created before
      component: DateField

  proposal_my_tasks:
    filters:
      - due
    due:
      label: Due
      placeholder: 'Any deadline'
      enumOverrides:
        overdue: Overdue
        due_soon: Due soon

  proposal_my_requested_resources:
    filters:
      - proposal_state
      - offering_uuid
    proposal_state:
      label: Proposal state
      isMulti: true
      enumOverrides:
        draft: Draft
        submitted: Submitted
        in_review: In review
        accepted: Accepted
        rejected: Rejected
        canceled: Canceled
    offering_uuid:
      label: Offering
      name: offering
      operationId: marketplace_public_offerings_list

  proposal_proposals:
    filters:
      - state
      - call_uuid
      - round_uuid
      - organization_uuid
      - created_by_uuid
      - panel_uuid
      - post_award_status
      - final_report_overdue
    post_award_status:
      label: Extension or final report
      isMulti: true
      enumOverrides:
        extension_requested: Extension request submitted
        extension_in_assessment: Pending extension request assessment
        extension_pending_results: Pending extension request results
        project_extended: Project extended
        pending_final_report: Pending final report
        final_report_submitted: Final report submitted
        project_completed: Project completed
    final_report_overdue:
      label: Final report overdue
    state:
      facet: state
      isMulti: true
      enumOverrides:
        draft: Draft
        submitted: Submitted
        accepted: Accepted
        rejected: Rejected
        canceled: Canceled
        in_review: In review
    call_uuid:
      label: Call
      name: call
      facet: call
      # A call's own tabs fix the call: offering the others there would
      # switch the page to another call's proposals.
      isHidden: props.hideCall
      operationId: proposal_public_calls_list
    round_uuid:
      label: Round
      name: round
      facet: round
      operationId: proposal_protected_calls_rounds_list
      extraPath:
        uuid: props.callUuid
      searchParam: false
    organization_uuid:
      label: Organization running the call
      name: organization_uuid
      facet: organization
      operationId: customers_list
    created_by_uuid:
      label: Applicant
      name: applicant
      facet: applicant
      operationId: users_list
    panel_uuid:
      label: Panel
      name: panel
      facet: panel
      operationId: proposal_protected_calls_panels_list
      extraPath:
        uuid: props.callUuid
      searchParam: false

  proposal_public_calls:
    initialValues:
      state:
        - label: Active
          value: active
      has_active_round: false
    filters:
      - state
      - has_active_round
    state:
      isMulti: true
      # The public list holds no draft: a draft is its managers' to see.
      enumOverrides:
        active: Active
        archived: Archived
    has_active_round:
      label: Active round
      component: AwesomeCheckboxField
      badgeLabels:
        true: Yes
        false: All

  rancher_cluster:
    operationId: rancher_ingresses_list
    filters:
      - namespace_uuid
      - rancher_project_uuid
    namespace_uuid:
      extraQuery:
        cluster_uuid: 'props.cluster.uuid'
    rancher_project_uuid:
      extraQuery:
        cluster_uuid: 'props.cluster.uuid'

  invoice_items:
    filters:
      - customer_uuid
      - accounting_period
      - project_uuid
      - offering_uuid
    customer_uuid:
      label: Organization
      name: customer_uuid
    accounting_period:
      label: Period
      options: props.accountingPeriods
      mapTo: true
    project_uuid:
      name: project_uuid
    offering_uuid:
      name: offering
      operationId: marketplace_provider_offerings_list

    status:
      enumOverrides:
        Closed: Closed
        Open: Open
        Resolved: Resolved
        'Waiting for support': 'Waiting for support'

  support_issues:
    filters:
      - status
      - type
      - is_open
      - is_routed
    # Status and type are free text synced from the service desk, so no list
    # here could name their values: the options are the values the facets
    # count. A caller may still pass fixed ones as statusOptions/typeOptions.
    status:
      component: Select
      options: props.statusOptions
      facet: status
    type:
      component: Select
      options: props.typeOptions
      facet: type
    is_open:
      # A Select rather than a boolean checkbox: the dashboard's "Closed issues"
      # card links to is_open=false, and the generated boolean filter drops a
      # falsy value.
      label: Open or closed
      component: Select
      options:
        - value: true
          label: Open
        - value: false
          label: Closed
    is_routed:
      label: Routed to provider

  provider_tickets:
    filters:
      - status
      - priority
      - is_escalated
      - sla_breached
    # Free text synced from the service desk: the options are the values the
    # facets count, unless a caller passes fixed ones.
    status:
      component: Select
      options: props.statusOptions
      facet: status
    priority:
      component: Select
      options: props.priorityOptions
      facet: priority
    is_escalated:
      label: Escalated
    sla_breached:
      label: SLA breached

  user_tos_filters:
    operationId: marketplace_public_offerings_list
    filters:
      - user_has_consent
    user_has_consent:
      label: Consent status
      component: Select
      options:
        - value: true
          label: Accepted
        - value: false
          label: Not accepted

  user_pending_actions:
    operationId: user_actions_list
    filters:
      - action_type
      - urgency
      - overdue
      - include_silenced
    action_type:
      label: Action type
      component: Select
      options:
        - value: expiring_resource
          label: Expiring resource
        - value: pending_order
          label: Pending order approval

  marketplace_software_packages:
    filters:
      - catalog_name_exact
      - catalog_version_exact
      - catalog_type
      - category
      - license
      - toolchain_name
      - has_gpu
      - gpu_arch
    # The catalogue's own values: the options are those the facets count,
    # sent as exact matches ("2023" must not also select "2023.06").
    catalog_name_exact:
      label: Catalog
      name: catalog_name
      component: Select
      options: props.catalogNameOptions
      facet: catalog_name
    catalog_version_exact:
      label: Version
      name: catalog_version
      component: Select
      options: props.catalogVersionOptions
      facet: catalog_version
    catalog_type:
      label: Type
      facet: catalog_type
    # Free text on the server; the options are the values the facets count,
    # unless a caller passes fixed ones.
    category:
      label: Category
      component: Select
      options: props.categoryOptions
      facet: category
    license:
      label: License
      component: Select
      options: props.licenseOptions
      facet: license
    toolchain_name:
      label: Toolchain
      component: Select
      options: props.toolchainOptions
      facet: toolchain
    has_gpu:
      label: Has GPU
    gpu_arch:
      label: GPU architecture
      component: Select
      options: props.gpuArchOptions
      facet: gpu_arch

  user_data_access_history:
    operationId: users_data_access_history_list
    filters:
      - start_date
      - end_date
      - accessor_type
    start_date:
      label: Start date
      props:
        inline: true
    end_date:
      label: End date
      props:
        inline: true
    accessor_type:
      label: Accessor type
      component: Select
      options:
        - value: staff
          label: Staff
        - value: support
          label: Support
        - value: organization_member
          label: Organization member
        - value: service_provider
          label: Service provider
        - value: self
          label: Self-access

  promotions_campaigns:
    filters:
      - state
      - discount_type
    state:
      isMulti: true
      enumOverrides:
        Draft: Draft
        Active: Active
        Terminated: Terminated
    discount_type:
      label: Discount type
      options:
        - value: discount
          label: Discount
        - value: special_price
          label: Special price

  user_permission_requests:
    filters:
      - state
    initialValues:
      state:
        - value: pending
          label: Pending
    state:
      isMulti: true
      enumOverrides:
        pending: Pending
        approved: Approved
        rejected: Rejected

  call_reviewer_pools:
    filters:
      - invitation_status
    invitation_status:
      label: Status
      isMulti: true
      enumOverrides:
        pending: Pending
        accepted: Accepted
        declined: Declined
        expired: Expired

  proposal_reviews:
    filters:
      - state
      - call_uuid
      - round_uuid
      - organization_uuid
      - reviewer_uuid
      - proposal_uuid
    state:
      facet: state
      isMulti: true
      enumOverrides:
        in_review: In review
        submitted: Submitted
        rejected: Rejected
    call_uuid:
      label: Call
      name: call
      facet: call
      # A call's own tabs fix the call: offering the others there would
      # switch the page to another call's proposals.
      isHidden: props.hideCall
      operationId: proposal_public_calls_list
    round_uuid:
      label: Round
      name: round
      facet: round
      operationId: proposal_protected_calls_rounds_list
      extraPath:
        uuid: props.callUuid
      searchParam: false
    organization_uuid:
      label: Organization running the call
      name: organization_uuid
      facet: organization
      # An organization's reviews page fixes it, as "My reviews" fixes the
      # reviewer: the filter there would offer others and change nothing.
      isHidden: props.hideOrganization
      operationId: customers_list
    reviewer_uuid:
      label: Reviewer
      name: reviewer
      facet: reviewer
      isHidden: props.hideReviewer
      operationId: users_list
      valueField: uuid
      labelField: full_name
    proposal_uuid:
      label: Proposal
      name: proposal
      facet: proposal
      operationId: proposal_proposals_list
      extraQuery:
        call_uuid: props.callUuid

  proposals:
    operationId: proposal_proposals_list
    filters:
      - state
      - call_uuid
    state:
      facet: state
      isMulti: true
      enumOverrides:
        draft: Draft
        submitted: Submitted
        accepted: Accepted
        rejected: Rejected
        canceled: Canceled
        in_review: In review
    call_uuid:
      label: Call
      name: call
      facet: call
      operationId: proposal_public_calls_list
      # The applicant list drops this where the deployment hides calls; the
      # call-manager list keeps it in every mode, so it is a prop rather than
      # a second generated component.
      isHidden: props.hideCall

  proposal_requested_offerings:
    filters:
      - organization_uuid
      - call_uuid
      - state
      - offering_uuid
    organization_uuid:
      label: Organization
      name: organization_uuid
      facet: organization
      operationId: customers_list
    # By UUID, as the facets key them: the inline column filters set
    # {uuid, name}; values saved as {url} earlier are mapped by the pages.
    call_uuid:
      label: Call
      name: call
      facet: call
      operationId: proposal_public_calls_list
    state:
      label: Status
      facet: state
      isMulti: true
      enumOverrides:
        requested: Requested
        accepted: Accepted
        canceled: Canceled
    offering_uuid:
      label: Offering
      name: offering
      facet: offering
      operationId: marketplace_public_offerings_list
      extraQuery:
        shared: true

  credit_usage:
    operationId: invoice_items_list
    filters:
      - offering_uuid
      - resource_uuid
      - start_year
      - start_month
    offering_uuid:
      label: Offering
      name: offering
      operationId: marketplace_public_offerings_list
    resource_uuid:
      label: Resource
      name: resource
      operationId: marketplace_resources_list
      # invoice-items filters on resource__uuid (the marketplace Resource's own
      # uuid); without this the generator defaults to the option's resource_uuid
      # (the backend/scope uuid, null when unprovisioned) and the filter matches
      # nothing.
      valueField: uuid
      extraQuery:
        customer_uuid: props.customerUUID
    start_year:
      label: Year
      name: year
      component: Select
      options: props.yearOptions
    start_month:
      label: Month
      name: month
      component: Select
      options: props.monthOptions

  marketplace_stats_openstack_instances:
    filters:
      - customer_uuid
      - project_uuid
      - runtime_state
      - hypervisor_hostname
      - flavor_name
      - image_name
    customer_uuid:
      label: Organization
      name: customer_uuid
    project_uuid:
      name: project_uuid
      extraQuery:
        customer: 'props.organizationUuid'
    runtime_state:
      label: Runtime state
      component: Select
      options:
        - value: ACTIVE
          label: Active
        - value: SHUTOFF
          label: Shutoff
        - value: PAUSED
          label: Paused
        - value: SUSPENDED
          label: Suspended
        - value: ERROR
          label: Error
    hypervisor_hostname:
      label: Hypervisor
      placeholder: Hypervisor hostname...
    flavor_name:
      label: Flavor
      placeholder: Flavor name...
    image_name:
      label: Image
      placeholder: Image name...

  projects:
    filters:
      - user_uuid_with_active_role
      - conceal_finished_projects
      - include_terminated
      - is_removed
    user_uuid_with_active_role:
      label: Project administrator
      name: administrator
      operationId: users_list
      searchParam: full_name
      extraQuery:
        o: ['full_name']
    conceal_finished_projects:
      label: Conceal finished projects
      badgeLabels:
        true: Yes
        false: No
    include_terminated:
      label: Include removed
      badgeLabels:
        true: Yes
        false: No
    is_removed:
      label: Removal status
      placeholder: Select removal status
      enumOverrides:
        'undefined': All projects
        'false': Not removed
        'true': Removed

  marketplace_service_providers_projects:
    # is_removed is deliberately omitted: the backend viewset queries
    # Project.available_objects (non-removed only), so the advertised
    # is_removed param can never match removed projects.
    filters:
      - conceal_finished_projects
    conceal_finished_projects:
      label: Conceal finished projects
      badgeLabels:
        true: Yes
        false: No

  event_consumers:
    filters:
      - is_global
      - delivery
      - user_uuid
    delivery:
      label: Delivery
      placeholder: Any delivery
      enumOverrides:
        rmq: RabbitMQ queue
        webhook: HTTP webhook
    is_global:
      label: Scope
      placeholder: Any scope
      enumOverrides:
        'undefined': All consumers
        'true': Global (unscoped)
        'false': Scoped
    user_uuid:
      label: Owner

  marketplace_offering_merges:
    filters:
      - state
      - offering_uuid
      - created_by_uuid
    state:
      isMulti: true
      enumOverrides:
        draft: Draft
        previewed: Previewed
        queued: Queued
        running: Running
        done: Done
        failed: Failed
        undoing: Undoing
        undone: Undone
    offering_uuid:
      label: Offering
      name: offering
      operationId: marketplace_provider_offerings_list
      searchParam: name
    created_by_uuid:
      label: Created by
      name: created_by
      operationId: users_list
      searchParam: full_name

  proposal_offering_demand:
    componentName: OfferingDemandFilter
    filters:
      - offering_uuid
      - call_uuid
      - round_uuid
      - state_group
    offering_uuid:
      label: Offering
      name: offering
      operationId: marketplace_provider_offerings_list
      extraQuery:
        customer_uuid: props.providerUuid
    call_uuid:
      label: Call
      name: call
      operationId: proposal_public_calls_list
      extraQuery:
        offerings_provider_uuid: props.providerUuid
    round_uuid:
      label: Round
      name: round
      options: props.roundOptions
    state_group:
      label: Proposals
      isMulti: true
      enumOverrides:
        pending: Pending
        accepted: Accepted
        closed: Closed

  hpc_workspaces_jobs:
    filters:
      - time_window
    time_window:
      label: Time period
      # Lists every value, shortest first: enumOverrides replaces the options
      # and keepOrder keeps this order instead of sorting by value.
      keepOrder: true
      enumOverrides:
        1h: Last hour
        8h: Last 8 hours
        24h: Last 24 hours
        3d: Last 3 days
        7d: Last 7 days
