# osv-scanner suppressions. See https://google.github.io/osv-scanner/configuration/
# The CI "Scan JS dependencies" job passes --config=.osv-scanner.toml when this
# file exists (waldur-pipelines /templates/test/vulnerability-scan.yml).
#
# Add an [[IgnoredVulns]] block only when an advisory has no compatible fixed
# version, and state the re-evaluation trigger in the reason so the entry does
# not outlive its premise.

[[IgnoredVulns]]
id = "GHSA-fc5q-39xc-vjpf"
# picomatch ReDoS through single-branch repeated extglobs such as +(*), which
# analyzeRepeatedExtglob() in lib/parse.js skips. The advisory affects every
# version through 4.0.7 (last_affected, no fixed version), and 4.0.7 is the
# latest published release as of 2026-11. Both copies in the lockfile (2.3.2 via
# micromatch, 4.0.7 elsewhere) belong to build and dev tooling: vite, vitest,
# rollup plugins, sass's @parcel/watcher, stylelint, eslint resolvers, knip,
# lint-staged and storybook. They compile only glob patterns from repo config,
# never user input, and nothing from them reaches the bundle.
# Re-evaluate when picomatch publishes a patched release (then bump instead), or
# if application code under src/ starts matching globs at runtime.
reason = "No fixed picomatch release exists (all versions through 4.0.7 affected). Only build/dev tooling (vite, vitest, rollup, sass, stylelint, eslint, knip, lint-staged, storybook) uses it, on patterns from repo config; not bundled. Re-evaluate when picomatch ships a fix."
