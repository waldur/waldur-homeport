include:
  - project: "waldur/waldur-pipelines"
    file: "/templates/release/tag-release.yml"
  - project: "waldur/waldur-pipelines"
    file: "/templates/stages.yml"
  - project: "waldur/waldur-pipelines"
    file: "/templates/release/publish-multiarch.yml"
  - project: "waldur/waldur-pipelines"
    file: "/templates/validate/docker-compose-trigger.yml"
  - project: "waldur/waldur-pipelines"
    file: "/templates/test/lint-docker-image.yaml"
  - project: "waldur/waldur-pipelines"
    file: "/templates/test/lint-dockerfile.yaml"
  - project: "waldur/waldur-pipelines"
    file: "/templates/test/lint-md-files.yml"
  - project: "waldur/waldur-pipelines"
    file: "/templates/deploy/dev-env-update.yml"
  - project: "waldur/waldur-pipelines"
    file: "/templates/test/vulnerability-scan.yml"
  - project: "waldur/waldur-pipelines"
    file: "/templates/sbom/upload-sboms-to-docs.yml"
  - project: "waldur/waldur-pipelines"
    file: "/templates/sbom/generate-image-sbom.yml"
variables:
  COMPONENT_VERSION: "latest"

stages:
  - pre-test
  - test
  - build
  - release
  - validate
  - deploy
  - postdeploy

image: registry.hpc.ut.ee/mirror/library/node:lts-alpine3.22

cache:
  key: "$CI_COMMIT_REF_NAME"
  policy: pull
  paths:
    - .yarn
    - node_modules/

before_script:
  - apk add git || echo "Non-Alpine image, skipping"
  - yarn config set cache-folder .yarn
  - yarn install --frozen-lockfile

Scan JS dependencies:
  extends: .Vulnerability scan template
  variables:
    LOCKFILE_PATH: "yarn.lock"
  before_script:
    - wget -q "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64" -O /usr/local/bin/osv-scanner
    - chmod +x /usr/local/bin/osv-scanner

.linter-rules: &linter-rules
  stage: test
  interruptible: true
  rules:
    - if: '$SKIP_TESTS == "true" || $SKIP_TESTS == "yes"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - src/**/*.css
        - src/**/*.scss
        - src/**/*.ts
        - src/**/*.tsx
        - package.json
        - yarn.lock
        - tsconfig.json
        - typings.d.ts
        - vite.config.ts
        - .eslintrc.cjs
        - .eslintignore
        - .gitlab-ci.yml

Run type checking:
  <<: *linter-rules
  script:
    - yarn tsgo -b

Run JS linters:
  <<: *linter-rules
  script:
    - yarn oxlint
    - yarn format:check
    - yarn lint:check

Run style and dependency checks:
  <<: *linter-rules
  script:
    - yarn style:check
    - yarn deps:unused
    - yarn deps:circular

Run code duplication detection:
  stage: test
  interruptible: true
  rules:
    - if: '$SKIP_TESTS == "true" || $SKIP_TESTS == "yes"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - src/**/*.css
        - src/**/*.scss
        - src/**/*.ts
        - src/**/*.tsx
        - .gitlab-ci.yml
  script:
    # Pin to the last pure-Node release. jscpd 5.x replaced the Node
    # implementation with a Rust binary (`cpd`) shipped per-platform via
    # optional npm packages (cpd-{os}-{arch}-{libc}). On cold-cache
    # runners the musl variant the Alpine image needs isn't always
    # pulled in, and the binary also uses kebab-case flags incompatible
    # with the legacy CLI used below. Pinning sidesteps both issues
    # until the project is ready to migrate the script.
    - npm install -g jscpd@4.2.5
    - npx jscpd src/ --exitCode 1 -r consoleFull --pattern "**/*.scss"
    - npx jscpd src/ --exitCode 1 -r consoleFull --pattern "**/*.tsx" -k 250

Run unit tests:
  stage: test
  interruptible: true
  variables:
    # vitest --coverage runs close to Node's default ~4 GB old-space ceiling and
    # OOMs when the build cache misses. Raise the heap for the test workers.
    NODE_OPTIONS: "--max-old-space-size=8192"
  rules:
    - if: '$SKIP_TESTS == "true" || $SKIP_TESTS == "yes"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - src/**/*.css
        - src/**/*.scss
        - src/**/*.ts
        - src/**/*.tsx
        - package.json
        - yarn.lock
        - tsconfig.json
        - typings.d.ts
        - vite.config.ts
        - test/*
      allow_failure: true
  script:
    - yarn vitest --run --reporter junit --outputFile junit.xml --coverage
  coverage: /All\sfiles.*?\s+(\d+.\d+)/
  artifacts:
    when: always
    paths:
      - junit.xml
      - coverage/
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml

Run E2E tests:
  image:
    name: mcr.microsoft.com/playwright:v1.61.1-noble
    entrypoint: [""]
  stage: test
  interruptible: true
  rules:
    - if: '$SKIP_TESTS == "true" || $SKIP_TESTS == "yes"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - src/**/*.css
        - src/**/*.scss
        - src/**/*.ts
        - src/**/*.tsx
        - package.json
        - yarn.lock
        - tsconfig.json
        - typings.d.ts
        - vite.config.ts
        - e2e/**/*
        - playwright.config.ts
      allow_failure: true
  script:
    - yarn test:e2e
  artifacts:
    expire_in: 1 week
    when: always
    paths:
      - test-results/

Build artifact:
  stage: pre-test
  interruptible: true
  rules:
    - if: '$SKIP_TESTS == "true" || $SKIP_TESTS == "yes"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "develop"'
  script:
    - yarn build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

Publish YOLO docker image:
  stage: test
  interruptible: true
  image:
    name: quay.io/containers/buildah:latest
    entrypoint: [""]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    BUILDAH_FORMAT: docker
    BUILDAH_ISOLATION: chroot
    DOCKER_HUB_REGISTRY: "docker.io"
    IMAGE_TAG: "opennode/${CI_PROJECT_NAME}:yolo"
  before_script:
    - echo "[+] Build and publish YOLO docker image for ${CI_DEFAULT_BRANCH} branch"
    # Log in to Docker Hub
    - echo "${WALDUR_DOCKER_HUB_PASSWORD}" | buildah login -u "${WALDUR_DOCKER_HUB_USER}" --password-stdin "${DOCKER_HUB_REGISTRY}"
  script:
    - echo "[+] Building image ${IMAGE_TAG}"
    - |
      buildah bud \
        --build-arg DOCKER_REGISTRY="${DOCKER_REGISTRY}" \
        --build-arg COMMIT_INFO="${CI_COMMIT_SHA}" \
        --build-arg VERSION="latest" \
        -t "${IMAGE_TAG}" \
        -f "${CI_PROJECT_DIR}/Dockerfile" \
        "${CI_PROJECT_DIR}"
    - buildah push "${IMAGE_TAG}" "docker://${IMAGE_TAG}"

Publish latest docker image:
  stage: release
  interruptible: true
  image:
    name: quay.io/containers/buildah:latest
    entrypoint: [""]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    BUILDAH_FORMAT: docker
    BUILDAH_ISOLATION: chroot
    DOCKER_HUB_REGISTRY: "docker.io"
  before_script:
    - echo "[+] Build and publish latest docker image for ${CI_DEFAULT_BRANCH} branch"
    - echo "${WALDUR_DOCKER_HUB_PASSWORD}" | buildah login -u "${WALDUR_DOCKER_HUB_USER}" --password-stdin "${DOCKER_HUB_REGISTRY}"
    - echo "${CI_REGISTRY_PASSWORD}" | buildah login -u "${CI_REGISTRY_USER}" --password-stdin "${CI_REGISTRY}"
  script:
    - buildah pull "docker://opennode/${CI_PROJECT_NAME}:yolo"
    - buildah tag "opennode/${CI_PROJECT_NAME}:yolo" "opennode/${CI_PROJECT_NAME}:latest"
    - buildah push "opennode/${CI_PROJECT_NAME}:latest" "docker://opennode/${CI_PROJECT_NAME}:latest"
    - buildah tag "opennode/${CI_PROJECT_NAME}:yolo" "${CI_REGISTRY_IMAGE}:latest"
    - buildah push "${CI_REGISTRY_IMAGE}:latest" "docker://${CI_REGISTRY_IMAGE}:latest"

Publish multiarch docker image with specific version:
  extends: .Publish multiarch docker image with specific version template
  variables:
    EXTRA_BUILD_ARGS: "--build-arg COMMIT_INFO=${CI_COMMIT_TAG} --build-arg VERSION=${CI_COMMIT_TAG}"

Test Multi-arch docker image build:
  stage: test
  interruptible: true
  image: registry.hpc.ut.ee/mirror/docker:latest
  services:
    - name: "docker:dind"
      command: ["--mtu=1400"]
  rules:
    # Skip tests if said so
    - if: '$SKIP_TESTS == "true" || $SKIP_TESTS == "yes"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - Dockerfile
        - docker/**/*
        - .gitlab-ci.yml
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_REGISTRY: registry.hpc.ut.ee/mirror/
    DOCKER_HUB_REGISTRY: "docker.io"
  cache: []
  before_script:
    - apk update
    - apk add --no-cache gcc python3-dev musl-dev linux-headers openldap-dev openssl libffi-dev libjpeg-turbo-dev libxml2-dev libxslt-dev
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY --username "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker context create builder
    - docker buildx version
    - docker buildx create builder --use
    - docker buildx build --platform linux/amd64,linux/arm64 --build-arg DOCKER_REGISTRY=$DOCKER_REGISTRY -t ${CI_REGISTRY_IMAGE}:${CI_MERGE_REQUEST_ID}-multiarch --push .
    - docker buildx imagetools inspect ${CI_REGISTRY_IMAGE}:${CI_MERGE_REQUEST_ID}-multiarch
    - docker pull ${CI_REGISTRY_IMAGE}:${CI_MERGE_REQUEST_ID}-multiarch
    - docker image inspect ${CI_REGISTRY_IMAGE}:${CI_MERGE_REQUEST_ID}-multiarch

Lint docker image:
  extends: .Lint docker image template
  variables:
    IMAGE: opennode/waldur-homeport:latest
    DOCKERFILE: Dockerfile
  before_script: []

Lint dockerfile:
  extends: .Lint dockerfile template
  variables:
    DOCKERFILE: Dockerfile
    HADOLINT_CONFIG: |
      ignored:
        - DL3018 # "versions for `apk add`" warning
  before_script: []

Generate Image SBOM:
  extends: .Generate Image SBOM template
  rules:
    - when: never
  variables:
    PROJECT_NAME: "waldur-homeport"

Generate Codebase SBOM:
  stage: build
  image: registry.hpc.ut.ee/mirror/library/node:lts-alpine
  interruptible: true
  allow_failure: true
  rules:
    - when: never
    # - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
  cache: []
  before_script: []
  script:
    - apk add git || echo "Non-Alpine image, skipping"
    - yarn set version berry
    - yarn install --no-immutable
    - yarn dlx -q @cyclonedx/yarn-plugin-cyclonedx --spec-version 1.6 --output-file waldur-homeport-${CI_COMMIT_TAG}-source.cyclonedx.json -v
    - echo "SBOM generated. Size:"
    - du -h waldur-homeport-${CI_COMMIT_TAG}-source.cyclonedx.json
    - tar -czf waldur-homeport-${CI_COMMIT_TAG}-source.cyclonedx.tar.gz waldur-homeport-${CI_COMMIT_TAG}-source.cyclonedx.json
    - echo "SBOM archived. Size:"
    - du -h waldur-homeport-${CI_COMMIT_TAG}-source.cyclonedx.tar.gz
  artifacts:
    paths:
      - waldur-homeport-${CI_COMMIT_TAG}-source.cyclonedx.tar.gz

Build test docker image:
  stage: test
  interruptible: true
  image:
    name: quay.io/containers/buildah:latest
    entrypoint: [""]
  rules:
    - if: '$SKIP_TESTS == "true" || $SKIP_TESTS == "yes"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  variables:
    BUILDAH_FORMAT: docker
    BUILDAH_ISOLATION: chroot
  before_script:
    - echo "[+] Build and publish docker image for merge request ${CI_MERGE_REQUEST_ID}"
    - mkdir -p build-info
    - echo $CI_COMMIT_SHA > build-info/COMMIT_SHA
    # Log in to GitLab Container Registry
    - echo "${CI_REGISTRY_PASSWORD}" | buildah login -u "${CI_REGISTRY_USER}" --password-stdin "${CI_REGISTRY}"
  script:
    # 1. Build a standard image for E2E tests (No ASSET_PATH)
    - echo "[+] Building standard image for E2E tests"
    - |
      buildah bud \
        --build-arg DOCKER_REGISTRY="${DOCKER_REGISTRY}" \
        -t "${CI_REGISTRY_IMAGE}:${CI_MERGE_REQUEST_ID}-e2e" \
        -f "${CI_PROJECT_DIR}/Dockerfile" \
        "${CI_PROJECT_DIR}"
    - buildah push "${CI_REGISTRY_IMAGE}:${CI_MERGE_REQUEST_ID}-e2e"

    # 2. Build the image with ASSET_PATH for the k8s preview environment
    - echo "[+] Building image with ASSET_PATH for k8s preview"
    - |
      buildah bud \
        --build-arg DOCKER_REGISTRY="${DOCKER_REGISTRY}" \
        --build-arg ASSET_PATH="/${CI_MERGE_REQUEST_ID}/" \
        -t "${CI_REGISTRY_IMAGE}:${CI_MERGE_REQUEST_ID}" \
        -f "${CI_PROJECT_DIR}/Dockerfile" \
        "${CI_PROJECT_DIR}"
    - buildah push "${CI_REGISTRY_IMAGE}:${CI_MERGE_REQUEST_ID}"

Trigger integration tests:
  stage: validate
  trigger:
    project: waldur/waldur-integration-testing
    branch: main
    strategy: depend
  # TRIGGER_SOURCE lets the downstream E2E suite skip backend-only jobs
  # (ansible, mitogen, SCIM, OIDC, GLAuth) that a frontend change cannot affect.
  variables:
    TRIGGER_SOURCE: homeport
  # Only run E2E when a change can actually affect the built frontend image.
  # Docs / lint-config / unit-test-only MRs (e.g. *.md, docs/**, eslint-rules/**,
  # e2e/**, test/**) skip the whole downstream suite. The include-list is a
  # positive filter: it matches whenever any runtime-affecting path changed.
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: &integration_test_changes
        - src/**/*
        - locales/**/*
        - docker/**/*
        - Dockerfile
        - index.html
        - package.json
        - yarn.lock
        - vite.config.ts
        - vite-plugin-react-displayname.ts
        - tsconfig.json
        - typings.d.ts
        - template.json
        - generate-filters.cjs
        - generate-filters-config.yaml
        - .gitlab-ci.yml
      variables:
        WALDUR_HOMEPORT_IMAGE: "${CI_REGISTRY_IMAGE}:latest"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *integration_test_changes
      variables:
        WALDUR_HOMEPORT_IMAGE: "${CI_REGISTRY_IMAGE}:${CI_MERGE_REQUEST_ID}-e2e"

Test k8s deployment:
  stage: validate
  image:
    name: "registry.hpc.ut.ee/mirror/alpine/kubectl:1.33.3"
    entrypoint: ['']
  interruptible: false
  environment:
    name: test-${CI_MERGE_REQUEST_ID}
    action: start
    on_stop: Cleanup test k8s deployment
    url: https://helm-testing.waldur.com/${CI_MERGE_REQUEST_ID}/
  rules:
    - if: '$SKIP_TESTS == "true" || $SKIP_TESTS == "yes"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - export KUBECONFIG=${K8S_CONFIG_WALDUR_HELM_TEST}
    - apk update && apk add gettext
  script:
    - kubectl config current-context
    - envsubst < k8s-test/deployment-tpl.yaml > k8s-test/deployment.yaml
    - envsubst < k8s-test/service-tpl.yaml > k8s-test/service.yaml
    - envsubst < k8s-test/ingress-tpl.yaml > k8s-test/ingress.yaml
    - kubectl delete secret waldur-homeport-test-${CI_MERGE_REQUEST_ID} || true
    - kubectl create secret docker-registry waldur-homeport-test-${CI_MERGE_REQUEST_ID} --docker-server=${CI_REGISTRY} --docker-username=${CI_REGISTRY_USER} --docker-password=${CI_REGISTRY_PASSWORD}
    - kubectl apply -f k8s-test/deployment.yaml --wait
    - kubectl apply -f k8s-test/service.yaml
    - kubectl apply -f k8s-test/ingress.yaml
    - kubectl rollout restart deployment waldur-homeport-test-${CI_MERGE_REQUEST_ID}
    # Wait for rollout completion
    - kubectl rollout status deployment waldur-homeport-test-${CI_MERGE_REQUEST_ID} --timeout 120s
    # Wait a bit more to avoid race conditions
    - sleep 5
    - kubectl get pods -l app=waldur-homeport-test-${CI_MERGE_REQUEST_ID} --field-selector=status.phase=Running
    - POD_NAME=$(kubectl get pod -l app=waldur-homeport-test-${CI_MERGE_REQUEST_ID} --sort-by=.metadata.creationTimestamp -o name | tail -n1)
    - echo $POD_NAME
    # Wait until the pod is ready to ensure the image is pulled
    - kubectl wait --timeout=180s --for=condition=Ready=true $POD_NAME
    - kubectl get pods -l app=waldur-homeport-test-${CI_MERGE_REQUEST_ID}
  allow_failure: true

Upload Image SBOM:
  extends: .Upload SBOM template
  rules:
    - when: never
  needs:
    - Generate Image SBOM
  variables:
    PROJECT_NAME: "waldur-homeport"
    SBOM_TYPE: "image"
    SBOM_DIR: "images"

Upload Source SBOM:
  extends: .Upload SBOM template
  rules:
    - when: never
  needs:
    - Generate Codebase SBOM
  variables:
    PROJECT_NAME: "waldur-homeport"
    SBOM_TYPE: "source"
    SBOM_DIR: "source"

Cleanup test k8s deployment:
  stage: deploy
  image:
    name: "registry.hpc.ut.ee/mirror/alpine/kubectl:1.33.3"
    entrypoint: ['']
  interruptible: false
  rules:
  - if: '$SKIP_TESTS == "true" || $SKIP_TESTS == "yes"'
    when: never
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    when: manual
  environment:
    name: test-${CI_MERGE_REQUEST_ID}
    action: stop
  before_script:
    - export KUBECONFIG=${K8S_CONFIG_WALDUR_HELM_TEST}
  script:
    - kubectl delete secret,deployment,service,ingress waldur-homeport-test-${CI_MERGE_REQUEST_ID} --ignore-not-found=true --wait=true

Cleanup previous k8s test deployment:
  extends: Cleanup test k8s deployment
  stage: .pre
  rules:
  - if: '$SKIP_TESTS == "true" || $SKIP_TESTS == "yes"'
    when: never
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

Release tag:
  extends: .release-tag-base
  image: registry.hpc.ut.ee/mirror/library/node:lts-alpine
  before_script:
    - apk add --no-cache git
    - !reference [.release-tag-base, before_script]
  script:
    - |
      git tag -a $RELEASE_VERSION -m "Release $RELEASE_VERSION" || echo "Tag already exists"
      git push origin $RELEASE_VERSION || echo "Tag already pushed"
